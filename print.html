<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Loyalty Machine — print edition</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0b;
        color: #f6f4ee;
        font: 500 12px/1.5 ui-monospace, Menlo, monospace;
      }
      .sheet {
        page-break-after: always;
        break-after: page;
        background: #f6f4ee;
        width: 1600px;
        height: 900px;
      }
      .sheet svg {
        display: block;
        width: 1600px;
        height: 900px;
      }
      .bar {
        position: sticky;
        top: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 18px;
        background: rgba(10, 10, 11, 0.94);
        border-bottom: 1px solid rgba(246, 244, 238, 0.12);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 10px;
      }
      .bar button {
        appearance: none;
        background: transparent;
        color: #f6f4ee;
        border: 1px solid rgba(246, 244, 238, 0.24);
        padding: 7px 12px;
        font: inherit;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .bar button:hover {
        background: rgba(246, 244, 238, 0.12);
      }
      .bar span {
        color: #8b8578;
      }
      #pages {
        padding: 24px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      @page {
        size: 1600px 900px;
        margin: 0;
      }
      @media print {
        html,
        body {
          background: #fff;
        }
        .bar {
          display: none;
        }
        #pages {
          padding: 0;
          gap: 0;
        }
        .sheet {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button onclick="window.print()">Print / save as PDF</button>
      <strong>The Loyalty Machine</strong>
      <span>45 pages · 1600 × 900 · print at 100% with backgrounds on</span>
    </div>
    <div id="pages"><div id="boot" style="padding: 40px">Setting type…</div></div>
    <script type="module" src="/deck/print.tsx"></script>
  </body>
</html>
